services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eghatha-api

    environment:
      - ASPNETCORE_ENVIRONMENT=Development

    depends_on:
      redis:
        condition: service_started
      sqlserver:
        condition: service_healthy

    env_file:
      - .env

    ports:
      - "8080:8080"

    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: eghatha-redis

    command: redis-server --appendonly yes

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    restart: unless-stopped

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: eghatha-sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQLSERVER_SA_PASSWORD}

    ports:
      - "1433:1433"

    volumes:
      - sqlserver_data:/var/opt/mssql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    restart: unless-stopped

volumes:
  redis_data:
  sqlserver_data: